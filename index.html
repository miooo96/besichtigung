<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Besichtigung">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Besichtigung</title>
<!--
  Standort-Besichtigung - Schritt fuer Schritt je Standort, mit Mass-Foto
  und ZIP zum Weitergeben.
  WICHTIG: In diesem Programm stehen KEINE Kundendaten. Die Liste wird auf
  dem Handy aus einer Datei geladen (AirDrop) und bleibt nur dort.
  Angaben: localStorage dieser Seite. Fotos/Videos: IndexedDB dieser Seite.
  Nichts wird an einen Server geschickt - die ZIP entsteht auf dem Geraet.
-->
<style>
  :root {
    --blau: #0f2a4a; --blau2: #1d4ed8; --gruen: #047857; --gruen-hell: #d1fae5;
    --rot: #b91c1c; --rot-hell: #fee2e2; --orange: #b45309; --orange-hell: #fef3c7;
    --grau: #6b7280; --linie: #e5e7eb; --hg: #f3f4f6; --text: #111827;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--hg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .kopf { position: sticky; top: 0; z-index: 5; background: var(--blau); color: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }
  .kopf h1 { margin: 0; font-size: 19px; }
  .kopf .unter { font-size: 13px; opacity: .8; }
  .kopf .zeile { display: flex; align-items: center; gap: 10px; }
  .kopf button.zurueck { background: none; border: 0; color: #fff; font-size: 17px; padding: 6px 0; }
  main { padding: 12px 12px calc(env(safe-area-inset-bottom) + 110px); }
  .suche { display: flex; gap: 8px; margin-bottom: 10px; }
  .suche input { flex: 1; font-size: 17px; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; }
  .filter { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { border: 1px solid #d1d5db; background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 15px; color: var(--text); }
  .chip.an { background: var(--blau); color: #fff; border-color: var(--blau); }
  .stand { font-size: 14px; color: var(--grau); margin: 0 2px 8px; }
  .kunde { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 12px;
    padding: 12px; margin-bottom: 8px; border: 1px solid var(--linie); width: 100%; text-align: left; font: inherit; color: inherit; }
  .kunde .nr { font-size: 21px; font-weight: 700; min-width: 46px; text-align: center; }
  .kunde .mitte { flex: 1; min-width: 0; }
  .kunde .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kunde .ort { font-size: 14px; color: var(--grau); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; color: #fff; }
  .sc.s200 { background: var(--blau2); } .sc.s2002 { background: var(--gruen); } .sc.sx { background: var(--orange); }
  .status { font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .status.offen { background: var(--hg); color: var(--grau); }
  .status.laeuft { background: var(--orange-hell); color: var(--orange); }
  .status.ja { background: var(--gruen-hell); color: var(--gruen); }
  .status.nein { background: var(--rot-hell); color: var(--rot); }
  .karte { background: #fff; border-radius: 14px; padding: 14px; border: 1px solid var(--linie); margin-bottom: 12px; }
  .karte h2 { margin: 0 0 4px; font-size: 21px; }
  .karte .z2 { color: #374151; font-size: 15px; margin-bottom: 8px; }
  .daten { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 15px; }
  .daten dt { color: var(--grau); } .daten dd { margin: 0; font-weight: 550; }
  .daten a { color: var(--blau2); }
  .fortschritt { display: flex; gap: 5px; margin: 4px 0 12px; }
  .fortschritt span { flex: 1; height: 6px; border-radius: 3px; background: #d1d5db; }
  .fortschritt span.fertig { background: var(--gruen); } .fortschritt span.jetzt { background: var(--blau2); }
  .schritt h3 { margin: 0 0 6px; font-size: 20px; }
  .hinweis { font-size: 15px; color: #374151; background: #eef2ff; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .gross { display: block; width: 100%; font-size: 19px; font-weight: 650; padding: 16px; border-radius: 12px;
    border: 2px solid #d1d5db; background: #fff; color: var(--text); margin-bottom: 10px; }
  .gross.start { background: var(--blau); border-color: var(--blau); color: #fff; }
  .gross.haken { border-color: var(--gruen); background: var(--gruen-hell); color: var(--gruen); }
  .knopf2 { font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; background: #fff; width: 100%; margin-bottom: 8px; color: var(--text); }
  .janein { display: flex; gap: 10px; margin-bottom: 12px; }
  .janein button { flex: 1; font-size: 20px; font-weight: 700; padding: 18px 0; border-radius: 12px; border: 2px solid #d1d5db; background: #fff; color: var(--text); }
  .janein button.ja.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }
  .janein button.nein.an { background: var(--rot); border-color: var(--rot); color: #fff; }
  .wahl { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .wahl button { font-size: 20px; font-weight: 700; padding: 18px 0; border-radius: 12px; border: 2px solid #d1d5db; background: #fff; color: var(--text); }
  .wahl button.an { background: var(--blau2); border-color: var(--blau2); color: #fff; }
  .merkmale { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .merkmale button { font-size: 16px; padding: 10px 13px; border-radius: 999px; border: 2px solid #d1d5db; background: #fff; color: var(--text); }
  .merkmale button.an { background: var(--blau2); border-color: var(--blau2); color: #fff; }
  input.text { width: 100%; font-size: 17px; padding: 12px; border-radius: 12px; border: 2px solid #d1d5db; margin-bottom: 12px; }
  label.feld { display: block; font-size: 15px; color: #374151; margin: 4px 0 6px; }
  input.cm { width: 100%; font-size: 24px; padding: 12px; border-radius: 12px; border: 2px solid #d1d5db; text-align: center; margin-bottom: 12px; }
  textarea { width: 100%; min-height: 150px; font: inherit; padding: 12px; border-radius: 12px; border: 2px solid #d1d5db; }
  .bilder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 12px; }
  .bild { position: relative; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: #e5e7eb; border: 1px solid var(--linie); }
  .bild img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bild .vid { display: flex; height: 100%; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; color: #374151; }
  .bild .vid small { font-size: 12px; margin-top: 4px; }
  .bild button.weg { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 16px; border: 0;
    background: #111827cc; color: #fff; font-size: 18px; line-height: 32px; padding: 0; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--linie);
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 10px; z-index: 6; }
  .fuss button { flex: 1; font-size: 18px; font-weight: 650; padding: 14px; border-radius: 12px; border: 2px solid #d1d5db; background: #fff; color: var(--text); }
  .fuss button.weiter { background: var(--blau); border-color: var(--blau); color: #fff; }
  .fuss button.fertig { background: var(--gruen); border-color: var(--gruen); color: #fff; }
  .zusammen { list-style: none; margin: 0; padding: 0; } .zusammen li { margin-bottom: 4px; }
  .fehlt { color: var(--orange); font-weight: 650; } .ok { color: var(--gruen); }
  .zeiten { font-size: 13px; color: var(--grau); margin-top: 8px; }
  .leer { text-align: center; padding: 30px 16px; } .leer p { color: #374151; }
  .klein { font-size: 13px; color: var(--grau); }
  .ordner { font-weight: 700; font-size: 17px; margin: 16px 2px 8px; }
  .zipkunde .titel { font-weight: 650; } .zipkunde .datei { font-size: 13px; color: #374151; }
  .zipkunde .mini { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
  .zipkunde .mini img, .zipkunde .mini span { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #e5e7eb;
    display: inline-flex; align-items: center; justify-content: center; font-size: 22px; }
  .meldung { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 74px); background: #111827ee; color: #fff;
    padding: 10px 14px; border-radius: 12px; font-size: 15px; z-index: 20; display: none; pointer-events: none; text-align: center; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div class="meldung" id="meldung"></div>
<input type="file" id="datei" accept=".json,application/json">
<!-- Kamera direkt (capture) und Auswahl aus der Fotos-App (ohne capture) -->
<input type="file" id="kamFoto" accept="image/*" capture="environment">
<input type="file" id="kamVideo" accept="video/*" capture="environment">
<input type="file" id="wahlFoto" accept="image/*" multiple>
<input type="file" id="wahlVideo" accept="video/*" multiple>

<script>
"use strict";
/* ================= Speicher (nur auf diesem Geraet) ================= */
const K_KUNDEN = "bes.kunden", K_ERG = "bes.ergebnisse", K_INFO = "bes.info";
const lesen = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const schreiben = (k, v) => localStorage.setItem(k, JSON.stringify(v));
let kunden = lesen(K_KUNDEN, []);
let erg = lesen(K_ERG, {});
let info = lesen(K_INFO, {});
// Gruppen (Mirko 03.11.2026): "woche" = diese Woche auf der normalen Tour (Nr. W1 ...),
// "samstag" = Rest am Samstag (Nr. 1 ... = Samstagsroute). Auswahl wird gemerkt.
const ui = { ansicht: "liste", id: null, schritt: 0, suche: "", nurOffen: false,
  gruppe: lesen("bes.gruppe", "woche"), ziel: null, zipLaeuft: false };

/* Fotos und Videos: IndexedDB "besichtigung-medien", Speicher "medien"
   { id, kunde, art: "front" | "mass" | "video", typ, name, blob, zeit } */
const DB = { name: "besichtigung-medien", version: 1, offen: null };
function db() {
  if (DB.offen) return DB.offen;
  DB.offen = new Promise((res, rej) => {
    const r = indexedDB.open(DB.name, DB.version);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore("medien", { keyPath: "id" });
      s.createIndex("kunde", "kunde");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return DB.offen;
}
async function tx(modus, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("medien", modus); const s = t.objectStore("medien");
    let ergebnis; Promise.resolve(fn(s)).then(v => ergebnis = v, () => {});   // Fehler meldet t.onerror
    t.oncomplete = () => res(ergebnis); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
// Normal: Datei (Blob) speichern - Safari legt sie als Datei ab, das schont den Arbeitsspeicher.
// Ausweg: In privaten Fenstern lehnt Safari Blobs ab ("Error preparing Blob/File data",
// im Test am 03.11. gesehen) -> dann als ArrayBuffer speichern.
async function medienSpeichern(m) {
  try { return await tx("readwrite", s => req(s.put(m))); }
  catch (err) {
    const { blob, ...rest } = m;
    const daten = await blob.arrayBuffer();   // vorher lesen: ein await in der Transaktion wuerde sie beenden
    return tx("readwrite", s => req(s.put({ ...rest, daten })));
  }
}
const alsBlob = m => { if (!m.blob && m.daten) m.blob = new Blob([m.daten], { type: m.typ }); return m; };
const medienLoeschen = id => tx("readwrite", s => req(s.delete(id)));
const medienVon = kid => tx("readonly", s => req(s.index("kunde").getAll(kid))).then(l => l.map(alsBlob));
const medienAlle = () => tx("readonly", s => req(s.getAll())).then(l => l.map(alsBlob));

// Vorschau-Adressen je Kunde (werden beim Wechsel freigegeben)
const cache = {};   // kid -> [{id, art, typ, groesse, url}]
async function ladeMedien(kid) {
  const liste = (await medienVon(kid)).sort((a, b) => a.zeit.localeCompare(b.zeit));
  (cache[kid] || []).forEach(m => m.url && URL.revokeObjectURL(m.url));
  cache[kid] = liste.map(m => ({ id: m.id, art: m.art, typ: m.typ, groesse: m.blob.size,
    url: m.typ.startsWith("image/") ? URL.createObjectURL(m.blob) : null }));
  return cache[kid];
}
// Mirko 03.11.2026: "Foto mit Maßband und Maße reicht ... ein Video ist hinfällig" -
// nur noch das Maß-Foto (Maßband-App oder Zollstock) und die Zahl. Kein Frontal-Foto, kein Video.
// Mirko 03.11.2026: "Standortangaben ... ob es stark belebt ist, oder eher ruhiger abgelegen" -> Schritt "Lage"
const SCHRITTE = ["Ankommen", "Maß rechts", "Lage", "Kommt in Frage?", "Notiz", "Abschluss"];
const LAGE = { belebt: "stark belebt", mittel: "mittel", ruhig: "ruhig / abgelegen" };
// Mirko 03.11.2026: "eintragbar wie Hauptstrasse oder besonderer Laden in der Naehe, z. B. Eisdiele,
// Geschaeft" - damit man aus der Ortsbeschreibung erkennt, ob viel Betrieb ist. Mehrfachauswahl + Freitext.
const MERKMALE = ["Hauptstraße", "Wohngebiet / Nebenstraße", "Ortsmitte", "Bushaltestelle", "Parkplatz",
  "Supermarkt / Geschäft", "Bäckerei", "Eisdiele", "Gaststätte / Kneipe", "Tankstelle", "Schule", "Gewerbegebiet"];
function umfeldText(r) { return [...(r.merkmale || []), ...(r.umfeld ? [r.umfeld] : [])].join(", "); }
const ZIP_ARTEN = ["mass"];   // nur diese Aufnahmen kommen in die ZIP
// Mirko 03.11.2026: statt Kamera direkt die Maßband-App. Apple bietet dafuer keinen
// direkten Link (Entwicklerforum 112820) - der offizielle Weg ist ein Kurzbefehl,
// den eine Webseite starten darf: shortcuts://run-shortcut?name=...
const KURZBEFEHL = "Maßband öffnen";
const MASSBAND_LINK = "shortcuts://run-shortcut?name=" + encodeURIComponent(KURZBEFEHL);

function jetzt() { return new Date().toISOString(); }
function e(id) { if (!erg[id]) erg[id] = { besuche: [], rechtsCm: "", rechtsFrei: "", lage: "", merkmale: [], umfeld: "", inFrage: "", notiz: "", fertig: false };
  if (!erg[id].merkmale) erg[id].merkmale = []; return erg[id]; }
function sichern(id) { if (id) erg[id].geaendert = jetzt(); schreiben(K_ERG, erg); }
// Besichtigungstag mit Wochentag (Mirko 03.11.2026: Freizeit/Samstag nur als Denkanstoss -
// sachlich ueber das Datum, ohne Kommentar). "Sa., 07.11.2026"
function tag(iso, mitJahr) { return new Date(iso).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", ...(mitJahr ? { year: "numeric" } : {}) }); }
function besuchsTage(r) { return [...new Set((r.besuche || []).map(b => tag(b.start, true)))]; }
function zeitraum(plan) {
  const alle = [...plan.ja, ...plan.nein].flatMap(x => (x.r.besuche || []).map(b => b.start)).sort();
  if (!alle.length) return "";
  const von = tag(alle[0], false), bis = tag(alle[alle.length - 1], true);
  return tag(alle[0], true) === bis ? `Besichtigung ${bis}` : `Besichtigungen ${von} bis ${bis}`;
}
function uhr(iso) { const d = new Date(iso); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + " " +
  d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function norm(s) { return String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss"); }
function scKlasse(sc) { return sc === "SC 200" ? "s200" : sc === "SC 20-02" ? "s2002" : "sx"; }
function scText(sc) { return /^SC/.test(sc || "") ? sc : "SC ?"; }
function mb(b) { return (b / 1048576).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " MB"; }
function adresse(k) { return (k.strasse + " " + (k.hnr || "")).trim(); }
function standorte(n) { return n + (n === 1 ? " Standort" : " Standorte"); }
function zeige(text, ms) { const m = document.getElementById("meldung"); m.textContent = text; m.style.display = "block";
  clearTimeout(zeige.t); zeige.t = setTimeout(() => m.style.display = "none", ms || 2600); }
function anzahl(kid, art) { return (cache[kid] || []).filter(m => m.art === art).length; }

function status(id) {
  const r = erg[id];
  if (!r || (!r.besuche.length && !r.fertig)) return { k: "offen", t: "offen" };
  if (!r.fertig) return { k: "laeuft", t: "begonnen" };
  if (r.inFrage === "ja") return { k: "ja", t: "✓ kommt in Frage" };
  if (r.inFrage === "nein") return { k: "nein", t: "✓ kommt nicht in Frage" };
  return { k: "ja", t: "✓ fertig" };
}

/* ================= Liste laden ================= */
document.getElementById("datei").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const liste = Array.isArray(d) ? d : d.kunden;
      if (!Array.isArray(liste) || !liste.length || !liste.every(k => k.id && k.name)) throw new Error("Format");
      kunden = liste; schreiben(K_KUNDEN, kunden);
      info.importiert = jetzt(); info.quelle = f.name;
      info.titel = d.titel || "Standort-Besichtigung"; info.auswahl = d.auswahl || "";
      info.vermerk = d.vermerk || "";   // z. B. wer es ausgearbeitet hat - steht in der Datei, nicht im Programm
      schreiben(K_INFO, info);
      zeige(liste.length + " Standorte geladen.");
      ui.ansicht = "liste"; zeichnen();
    } catch (err) { alert("Diese Datei ist keine passende Kundenliste."); }
    ev.target.value = "";
  };
  r.readAsText(f);
});

/* ================= Fotos / Videos aufnehmen ================= */
// Fotos werden auf max. 2400 px verkleinert (gute Bildschirmqualitaet, kleine ZIP).
async function verkleinern(datei) {
  try {
    const bild = await createImageBitmap(datei, { imageOrientation: "from-image" });
    const f = Math.min(1, 2400 / Math.max(bild.width, bild.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
    c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    return blob || datei;
  } catch (err) { return datei; }
}
async function dateienAufnehmen(dateien) {
  const kid = ui.id, art = ui.ziel; if (!kid || !art || !dateien.length) return;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  zeige("Wird gespeichert …", 20000);
  try {
    for (const f of dateien) {
      const istBild = f.type.startsWith("image/") || /\.(jpe?g|png|heic|heif)$/i.test(f.name);
      const blob = istBild ? await verkleinern(f) : f;
      await medienSpeichern({ id: kid + "|" + Date.now() + "|" + Math.random().toString(36).slice(2, 7),
        kunde: kid, art, typ: blob.type || f.type || (istBild ? "image/jpeg" : "video/quicktime"),
        name: f.name || "", blob, zeit: jetzt() });
    }
    const r = e(kid); if (!r.besuche.length) r.besuche.push({ start: jetzt() }); sichern(kid);
    await ladeMedien(kid);
    zeige(dateien.length === 1 ? "Gespeichert ✓" : dateien.length + " Dateien gespeichert ✓");
  } catch (err) {
    alert("Speichern hat nicht geklappt: " + (err && err.message || err) + "\nBitte noch einmal versuchen.");
  }
  zeichnen();
}
["kamFoto", "kamVideo", "wahlFoto", "wahlVideo"].forEach(id =>
  document.getElementById(id).addEventListener("change", ev => { const f = [...ev.target.files]; ev.target.value = ""; dateienAufnehmen(f); }));

/* ================= ZIP (ohne Komprimierung - Fotos/Videos sind schon komprimiert) ================= */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes, c) { c = c ^ 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function crcBlob(blob) {   // stueckweise, damit grosse Videos den Speicher nicht sprengen
  let c = 0; const STUECK = 8 * 1048576;
  for (let o = 0; o < blob.size; o += STUECK) c = crc32(new Uint8Array(await blob.slice(o, o + STUECK).arrayBuffer()), c);

async function alsDatenUrl(blob, max) {

    const f = Math.min(1, max / Math.max(b.width, b.height));
    const c = document.createElement("canvas"); c.width = Math.round(b.width * f); c.height = Math.round(b.height * f);
    c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);

async function stempeln(blob, zeilen) {

    const b = await createImageBitmap(blob, { imageOrientation: "from-image" });
    const w = b.width; let fs = Math.max(22, Math.round(w * 0.034)); const pad = Math.round(fs * 0.55);

    const schrift = (gr, fett) => `${fett ? "bold " : ""}${gr}px -apple-system, Helvetica, Arial, sans-serif`;

    while (fs > 14 && Math.max(...zeilen.map(t => x.measureText(t).width)) > w - 2 * pad) { fs -= 1; x.font = schrift(fs, true); }
    const balken = pad * 2 + zeilen.length * fs + (zeilen.length - 1) * Math.round(fs * 0.35);
    c.width = w; c.height = b.height + balken;
    x.fillStyle = "#0f2a4a"; x.fillRect(0, 0, w, balken);

async function teilen(datei) {

  } catch (err) { if (err && err.name === "AbortError") return; }

  document.body.appendChild(a); a.click(); a.remove();
}

  if (ui.zipLaeuft) return; ui.zipLaeuft = true; zeichnen();

    const plan = zipPlan(await medienAlle());
    if (!plan.ja.length && !plan.nein.length) { alert("Noch kein Standort mit „Kommt in Frage: Ja/Nein“ – die ZIP wäre leer."); return; }
    const eintraege = [];

    const bilder = await uebersichtBilder(plan, stempel);

    for (const gruppe of ["ja", "nein"]) for (const x of plan[gruppe]) {

  const s = document.getElementById("suche");
  if (s && ui.fokus) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

  const fertig = kunden.filter(k => erg[k.id] && erg[k.id].fertig).length;

    <div class="filter"><button class="chip ${ui.nurOffen ? "an" : ""}" data-akt="nuroffen">Nur offene</button></div>
    <div class="stand">${treffer.length} angezeigt · ${hatGruppen ? "W = diese Woche auf der Tour · 1, 2, 3 … = Samstagsroute" : "Nummer = Fahrreihenfolge"}</div>
    ${treffer.map(k => { const s = status(k.id); return `

    <div class="ordner">📁 ${OBER.ja} (${plan.ja.length})</div>${plan.ja.map(x => karte(x, "ja")).join("") || `<p class="klein">–</p>`}

      ${hatDaten(r) || n("mass") ? `<button class="knopf2" data-akt="kundeweg" style="margin-top:14px;color:var(--rot);border-color:#fca5a5">Diesen Kunden zurücksetzen</button>` : ""}</div>`;

      <label class="feld" for="cm">Rechts frei (cm)</label>
      <input class="cm" id="cm" type="number" inputmode="numeric" min="0" max="999" placeholder="z. B. 95" value="${esc(r.rechtsCm)}">
      <label class="feld">Reichen 90–100 cm?</label>${janein("rechtsFrei", r.rechtsFrei)}</div>`;
  } else if (s === 2) {
    inhalt = `<div class="schritt"><h3>3. Lage</h3>

      <label class="feld">Was ist dort? (mehrere möglich)</label>
      <div class="merkmale">${MERKMALE.map(m => `<button class="${(r.merkmale || []).includes(m) ? "an" : ""}" data-akt="merkmal" data-wert="${esc(m)}">${esc(m)}</button>`).join("")}</div>

      <div class="hinweis">Auch „Nein“ ankreuzen – dann ist klar, dass er geprüft wurde.</div>${janein("inFrage", r.inFrage)}</div>`;

  } else {
    const p = (ok, t) => `<li class="${ok ? "ok" : "fehlt"}">${ok ? "✓" : "○"} ${t}</li>`;
    inhalt = `<div class="schritt"><h3>6. Abschluss</h3><div class="karte"><ul class="zusammen">

/* ================= Eingaben ================= */
function eingabenUebernehmen() {
  if (ui.ansicht !== "kunde") return;
  const r = e(ui.id);
  const cm = document.getElementById("cm"); if (cm) r.rechtsCm = cm.value.trim();
  const no = document.getElementById("notiz"); if (no) r.notiz = no.value;
  const um = document.getElementById("umfeld"); if (um) r.umfeld = um.value.trim();
  sichern(ui.id);
}
document.addEventListener("input", ev => {
  if (ev.target.id === "suche") { ui.suche = ev.target.value; ui.fokus = true; zeichnen(); ui.fokus = false; return; }
  if (ev.target.id === "cm" || ev.target.id === "notiz" || ev.target.id === "umfeld") eingabenUebernehmen();
});
function zipFreigeben() { Object.values(ui.zipUrls || {}).forEach(u => URL.revokeObjectURL(u)); ui.zipUrls = null; ui.zipDaten = null; }

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-akt]"); if (!b || b.disabled) return;
  const akt = b.dataset.akt;
  if (akt !== "liste" && akt !== "oeffnen") eingabenUebernehmen();
  if (akt === "laden") return document.getElementById("datei").click();
  if (akt === "senden") return senden();
  if (akt === "zipbauen") return zipErstellen();
  if (akt === "uebersicht") return uebersichtTeilen();
  if (akt === "allesweg") return allesZuruecksetzen();
  if (akt === "kundeweg") return kundeZuruecksetzen(ui.id);
  if (akt === "aufnehmen") {   // muss direkt im Klick passieren, sonst blockiert iOS die Kamera
    ui.ziel = b.dataset.art;
    const id = b.dataset.quelle === "kamera" ? (ui.ziel === "video" ? "kamVideo" : "kamFoto") : (ui.ziel === "video" ? "wahlVideo" : "wahlFoto");
    return document.getElementById(id).click();
  }
  if (akt === "weg") {
    if (!confirm("Diese Aufnahme löschen?")) return;
    await medienLoeschen(b.dataset.mid); await ladeMedien(ui.id); return zeichnen();
  }
  if (akt === "mehr") { ui.ansicht = "mehr"; }
  else if (akt === "zip") { zipFreigeben(); ui.ansicht = "zip"; }
  else if (akt === "gruppe") { ui.gruppe = b.dataset.wert; schreiben("bes.gruppe", ui.gruppe); }
  else if (akt === "nuroffen") { ui.nurOffen = !ui.nurOffen; }
  else if (akt === "liste") { eingabenUebernehmen(); if (ui.ansicht === "zip") zipFreigeben(); ui.ansicht = "liste"; }
  else if (akt === "oeffnen") {
    if (ui.ansicht === "zip") zipFreigeben();
    ui.id = b.dataset.id; ui.ansicht = "kunde"; const r = erg[ui.id];
    ui.schritt = r && r.besuche.length && !r.besuche[r.besuche.length - 1].ende ? 1 : 0;
    ladeMedien(ui.id).then(() => { if (ui.ansicht === "kunde") zeichnen(); });
  }
  else if (akt === "ankommen") { const r = e(ui.id); r.besuche.push({ start: jetzt() }); r.fertig = false; sichern(ui.id);
    ui.schritt = 1; zeige("Ankunft erfasst – jetzt fotografieren."); }
  else if (akt === "weiter") {
    // Erledigte Kunden: nur blaettern (zum Ansehen/Nachtragen) - bleiben erledigt (Test 03.11.)
    const r = e(ui.id), offen = r.besuche.length && !r.besuche[r.besuche.length - 1].ende;
    if (ui.schritt === 0 && !offen && !r.fertig) {
      if (!confirm("Sind Sie jetzt vor Ort? Dann wird die Ankunft erfasst.")) return;
      r.besuche.push({ start: jetzt() }); r.fertig = false; sichern(ui.id);
    }
    ui.schritt = Math.min(ui.schritt + 1, SCHRITTE.length - 1); }
  else if (akt === "zurueck") { ui.schritt = Math.max(ui.schritt - 1, 0); }
  else if (akt === "merkmal") { const r = e(ui.id); const m = b.dataset.wert;
    r.merkmale = r.merkmale.includes(m) ? r.merkmale.filter(x => x !== m) : [...r.merkmale, m]; sichern(ui.id);
